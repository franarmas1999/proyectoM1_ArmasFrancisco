<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picasso Paletas - Crea tus paletas de colores</title>
    <link rel = "stylesheet" href="css/styles.css">
    <script src="src/script.js" defer></script>
</head>
<body>
    <header class="encabezado">
        <img class="encabezado-imagen" src="pictures/trimmed-image.png" alt="imgagen del logo">
        <h1 class="encabezado-titulo">PICASSO PALETAS</h1>
        <nav>
            <a href="/">Inicio</a>
            <a href="#footer">Footer</a>
        </nav>
    </header>
        
    <main>
        <p>Crea de forma rapida y facil paletas de colores</p>
        <button class="boton-principal" type="button">Generar Paleta</button>
    </main>
    
    <section id="seccion-cantidad" class="seccion-seleccion">
        <h2>Elige la cantidad de colores</h2>
        <button class="boton-seleccion activo" type="button">6</button>
        <button class="boton-seleccion" type="button">8</button>
        <button class="boton-seleccion" type="button">9</button>
    </section>
    
    <section id="seccion-formato" class="seccion-seleccion">
        <h2>Elige el formato de la paleta</h2>
        <button class="boton-seleccion activo" type="button">HSL</button>
        <button class="boton-seleccion" type="button">RGBA</button>
    </section>

    <section class="seccion-paleta"></section>

    <footer id="footer">
        <p>Picasso Paletas</p>
        <a href="#">Terminos y Condiciones</a>
        <a href="/contacto">Contacto</a>
        <a href="#">Más Informacion</a>
    </footer>

    <div id="alertaCopiado">Se copio el codigo del color</div>
</body>

</html>
